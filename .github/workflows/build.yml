name: build
# Runs the release gate (tools/gate_check.py: asset and code checks, a headless boot, the chunk dressing, the unit
# tests, the voice manifest and drop-in, and the APK build) and builds the Play bundle, on every push.
# Signing: with the repository secrets below the APKs and the Play bundle are signed with the
# release key; without them the APKs are signed with the shared test key in tools/keys (fine for
# sideloading) and no bundle is built. See docs/RELEASE.md.
#   SHARDFALL_KEYSTORE_B64   base64 of the release keystore file
#   SHARDFALL_KEYSTORE_USER  key alias
#   SHARDFALL_KEYSTORE_PASS  keystore password
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SKIP_BLENDER: "1"
      APK_REPACK_CACHE: /home/runner/apk-repack-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/toolchains
            ~/.local/share/godot/export_templates
          key: toolchain-${{ hashFiles('tools/provision.sh') }}
      - name: Provision Godot, export templates and the Android SDK
        run: bash tools/provision.sh
      # tools/apk_repack.py recompresses the engine library with zopfli (about 2 minutes); the result only
      # changes with the Godot version, so it is cached
      - name: APK repack cache
        uses: actions/cache@v4
        with:
          path: /home/runner/apk-repack-cache
          key: apk-repack-${{ hashFiles('tools/provision.sh') }}
      # zopfli for the APK repack; numpy and Pillow for the gate's model and texture checks; ffmpeg for the voice
      # pipeline's selftest and the drop-in check (installed only if the runner lacks it)
      - name: Install the gate's tools
        run: |
          python3 -m pip install --user zopfli numpy pillow
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libvorbis
      - name: Import assets
        run: ~/toolchains/godot/godot --headless --path godot --import || true
      - name: Parse check (every script compiles)
        run: ~/toolchains/godot/godot --headless --path godot res://tests/parse_all.tscn
      - name: Release key (if configured)
        env:
          KEY_B64: ${{ secrets.SHARDFALL_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SHARDFALL_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Release gate (every check, then the APK)
        env:
          SHARDFALL_KEYSTORE_USER: ${{ secrets.SHARDFALL_KEYSTORE_USER }}
          SHARDFALL_KEYSTORE_PASS: ${{ secrets.SHARDFALL_KEYSTORE_PASS }}
        run: python3 tools/gate_check.py
      - name: Build Play bundle (release key only)
        if: env.SHARDFALL_KEYSTORE != ''
        env:
          SHARDFALL_KEYSTORE_USER: ${{ secrets.SHARDFALL_KEYSTORE_USER }}
          SHARDFALL_KEYSTORE_PASS: ${{ secrets.SHARDFALL_KEYSTORE_PASS }}
        run: bash tools/build_android.sh aab
      - uses: actions/upload-artifact@v4
        with:
          name: shardfall-android
          path: |
            build/*.apk
            build/*.aab
          retention-days: 30
