name: build
# Tests the game and builds the Android packages on every push.
# Signing: with the repository secrets below the APKs and the Play bundle are signed with the
# release key; without them the APKs are signed with the shared test key in tools/keys (fine for
# sideloading) and no bundle is built. See docs/RELEASE.md.
#   SHARDFALL_KEYSTORE_B64   base64 of the release keystore file
#   SHARDFALL_KEYSTORE_USER  key alias
#   SHARDFALL_KEYSTORE_PASS  keystore password
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SKIP_BLENDER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/toolchains
            ~/.local/share/godot/export_templates
          key: toolchain-${{ hashFiles('tools/provision.sh') }}
      - name: Provision Godot, export templates and the Android SDK
        run: bash tools/provision.sh
      - name: Import assets
        run: ~/toolchains/godot/godot --headless --path godot --import || true
      - name: Unit tests
        run: |
          ~/toolchains/godot/godot --headless --path godot res://tests/tests.tscn -- unit | tee test.log
          grep -q ", 0 failed ==" test.log
      - name: Release key (if configured)
        env:
          KEY_B64: ${{ secrets.SHARDFALL_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SHARDFALL_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          SHARDFALL_KEYSTORE_USER: ${{ secrets.SHARDFALL_KEYSTORE_USER }}
          SHARDFALL_KEYSTORE_PASS: ${{ secrets.SHARDFALL_KEYSTORE_PASS }}
        run: bash tools/build_android.sh
      - name: Build Lite APK
        env:
          SHARDFALL_KEYSTORE_USER: ${{ secrets.SHARDFALL_KEYSTORE_USER }}
          SHARDFALL_KEYSTORE_PASS: ${{ secrets.SHARDFALL_KEYSTORE_PASS }}
        run: bash tools/build_android.sh lite
      - name: Build Play bundle (release key only)
        if: env.SHARDFALL_KEYSTORE != ''
        env:
          SHARDFALL_KEYSTORE_USER: ${{ secrets.SHARDFALL_KEYSTORE_USER }}
          SHARDFALL_KEYSTORE_PASS: ${{ secrets.SHARDFALL_KEYSTORE_PASS }}
        run: bash tools/build_android.sh aab
      - uses: actions/upload-artifact@v4
        with:
          name: shardfall-android
          path: |
            build/*.apk
            build/*.aab
          retention-days: 30
